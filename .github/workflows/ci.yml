# CI for the ingestion pipeline.
#
# WHAT THIS CAN AND CANNOT CHECK, stated up front so nobody reads a green tick
# as more than it is:
#
#   CAN  — the flake evaluates, the ingest app builds, and the ingest contract
#          tests pass: the item key matches the corpus export byte for byte, the
#          body format, the multipart upload and its retry policy. They are
#          pure-Python, stub the network, and need no services or secrets.
#
#   CANNOT — retrieval quality, or a real upload. Both need the private AI
#          Search instance and a scoped Cloudflare token, which CI does not hold
#          on purpose. The benchmark stays a local gate (CLAUDE.md § Verifying a
#          change) and this file does not pretend otherwise.
#
# CONVENTIONS COPIED, NOT INVENTED: action SHAs pinned with a version comment,
# DeterminateSystems/determinate-nix-action, least-privilege permissions,
# cancel-in-progress concurrency, and the "stage tree" step — all follow
# kattakath/nix-config's .github/workflows, which is the precedent this fleet
# already runs on.
name: ci

# ONE REQUIRED CHECK: `gate` (shared, kattakath/.github). It always runs and asserts
# that every job it `needs` ended EXACTLY as this event expects, so a skipped job can
# never pass for a green one ("A job that is skipped will report its status as
# Success", GitHub docs). `check` runs on every PR here: this repo is owned by a
# personal account, so GitHub offers it no merge queue and QUEUE_ENABLED stays unset.
on:
  # The owner lands by direct push to main, so CI runs there too (the drift checks included).
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  # Supersede stale PR runs; never cancel a queue run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # THE ONLY REQUIRED CHECK. Its job id is part of the ruleset; never rename it or
  # give it a `name:`.
  gate:
    if: ${{ !cancelled() }}
    needs: [check, flake-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # `expect` holds a deliberate SECOND copy of `check`'s `if:`. If the two
      # copies drift, gate goes red, so a bad edit fails closed.
      - uses: kattakath/.github/actions/gate@3d5ad5b9e04c853dbb0d82446255c9ef9230332a
        with:
          needs: ${{ toJSON(needs) }}
          expect: >-
            {"check": ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true' }}, "flake-check": true}

  check:
    name: flake + contract tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.QUEUE_ENABLED != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5

      # Flakes evaluate the GIT TREE, not the working directory, so anything
      # untracked is invisible to every nix command below. Staging first is what
      # makes a PR that adds a file actually get checked.
      - name: Stage tree (git purity)
        run: git add -A

      - name: Evaluate the flake
        run: nix flake check --no-build

      - name: Build the ingest app
        run: nix build .#ingest --no-link --print-out-paths

      # The real gate. The key test is the one that matters most: a key that
      # drifts by one byte makes a re-ingest ADD a duplicate item instead of
      # replacing the page.
      - name: Ingest contract tests
        run: nix develop --command python3 test_ingest.py

      # Extraction is the layer most likely to break without any code change,
      # because it depends on a third party's HTML. A dry run uploads nothing and
      # needs no credentials; it just proves pages still yield an article body.
      #
      # NON-BLOCKING ON PURPOSE: this reaches the public internet, so a network
      # blip or an upstream redesign would otherwise fail a PR that changed
      # nothing. It is a signal to read, not a gate to satisfy.
      - name: Extraction smoke test (advisory)
        continue-on-error: true
        run: |
          nix run .#ingest -- \
            https://developers.google.com/workspace/add-ons/studio --dry-run

  # Every flake check on both Linux arches, through the ONE shared reusable workflow
  # (kattakath/.github nix-flake-check.yml): the devShell's toolchain, treefmt, project-gate and each
  # generated file's drift check (files:<path>).
  flake-check:
    uses: kattakath/.github/.github/workflows/nix-flake-check.yml@cad98392a903fd89ec732ea116f38ec871e38ac0 # main
